paragraph=Connect/reconnect to a broker, subscribe to a caller-supplied topic list (re-subscribing automatically on reconnect, since subscriptions don't survive a session restart), and publish/dispatch raw payloads. Has no knowledge of what a topic means - interpreting a message is entirely the caller's responsibility.
